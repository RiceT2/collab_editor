<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Editor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; height: 300px; font-family: monospace; }
        #status { margin-top: 10px; color: green; }
    </style>
</head>
<body>
    <h1>Collaborative Text Editor</h1>
    <textarea id="editor" placeholder="Start typing..."></textarea>
    <div id="status">Connecting...</div>

    <script>
        const editor = document.getElementById('editor');
        const status = document.getElementById('status');
        const ws = new WebSocket('ws://localhost:8080');

        let lastText = '';
        let localChange = false;

        function computeDiff(oldText, newText) {
            let start = 0;
            while (start < oldText.length && start < newText.length && oldText[start] === newText[start]) {
                start++;
            }

            let oldEnd = oldText.length - 1;
            let newEnd = newText.length - 1;
            while (oldEnd >= start && newEnd >= start && oldText[oldEnd] === newText[newEnd]) {
                oldEnd--;
                newEnd--;
            }

            const removed = oldText.slice(start, oldEnd + 1);
            const inserted = newText.slice(start, newEnd + 1);
            return { from: start, to: oldEnd + 1, insert: inserted };
        }

        ws.onopen = () => {
            status.textContent = 'Connected';
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'init') {
                lastText = msg.state.text || '';
                editor.value = lastText;
            } else if (msg.type === 'op') {
                if (msg.text !== undefined) {
                    // Apply merged text from server
                    lastText = msg.text;
                    if (!localChange) {
                        editor.value = lastText;
                    }
                } else if (msg.op && msg.op.type === 'edit') {
                    const from = msg.op.from;
                    const to = msg.op.to;
                    const insert = msg.op.insert || '';
                    lastText = lastText.slice(0, from) + insert + lastText.slice(to);
                    if (!localChange) {
                        editor.value = lastText;
                    }
                }
            }
            localChange = false;
        };

        ws.onclose = () => {
            status.textContent = 'Disconnected';
        };

        editor.addEventListener('input', () => {
            const currentText = editor.value;
            const diff = computeDiff(lastText, currentText);
            ws.send(JSON.stringify({ type: 'edit', op: diff }));
            lastText = currentText;
            localChange = true;
        });
    </script>
</body>
</html>
